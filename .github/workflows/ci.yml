name: CI build

# Cross-platform safety net: builds the mu-family plugins (VST3/CLAP/Standalone) + the unit
# tests on Linux and Windows, and runs the test suites + the static checks.
# Catches portability regressions early. No signing / installers / tester deploy here — those
# stay on the local Windows release flow. mu-link (Win32 shared-memory bus) builds on Windows
# only until the POSIX backend lands; off-Windows the standalone bridge is a no-op stub.
#
# Run this manually before a release (Actions → Run workflow). macOS is NOT in this matrix —
# all Mac work (universal build + AU + lipo + pluginval + auval + render pack) lives in
# mac-validate.yml (also manual). Both bill GitHub minutes, so neither runs on push.

# MANUAL ONLY — a git push or PR must NEVER trigger CI (it costs money). This workflow
# runs solely when the owner explicitly dispatches it (Actions tab → Run workflow, or
# `gh workflow run ci.yml`). Do NOT re-add push/pull_request triggers.
on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      JUCE_PATH: ${{ github.workspace }}/JUCE

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # ThirdParty/{clap-juce-extensions,signalsmith-*} are submodules

      - name: Read JUCE pin
        id: juce
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < juce-version.txt)" >> "$GITHUB_OUTPUT"   # single pin, also checked by CMake

      - name: Checkout JUCE ${{ steps.juce.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ steps.juce.outputs.version }}
          path: JUCE

      # Static checks first: they take seconds and fail before the long build starts.
      - name: Static checks
        shell: pwsh
        run: |
          pwsh tests/scripts/check-core-boundary.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pwsh tests/scripts/check-comment-refs.ps1 -Quiet
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pwsh tests/scripts/check-juce-version.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pwsh tests/scripts/check-mod-targets.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pwsh tests/scripts/check-backlog.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libxcomposite-dev libxrender-dev libxi-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DMUFAMILY_DEPLOY_TESTERS=OFF

      - name: Build plugins + Standalone + tests
        run: >
          cmake --build build --config Debug --parallel --target
          mu-clid_VST3 mu-clid_CLAP mu-clid_Standalone mu-clid-midi_VST3
          mu-tant_VST3 mu-tant_CLAP mu-tant_Standalone
          mu-on_VST3 mu-on_CLAP mu-on_Standalone
          mu-toni_VST3 mu-toni_CLAP mu-toni_Standalone
          mu-core-tests mu-control-tests mu-clid-tests mu-clid-midi-tests
          mu-tant-tests mu-on-tests mu-toni-tests

      - name: Build mu-link (Windows only)
        if: runner.os == 'Windows'
        run: cmake --build build --config Debug --parallel --target mu-link mu-link-server mu-link-tone mu-link-harness mu-link-tests

      # (macOS build + AU + universal lipo + auval + render evidence pack live in
      # mac-validate.yml — workflow_dispatch only, to avoid the 10x macOS runner cost.)

      # Runs every *-tests executable the build produced, so a new test target needs no edit here.
      - name: Run all unit tests
        shell: bash
        run: |
          set -u
          fails=0; ran=0
          while IFS= read -r exe; do
            echo "::group::$exe"
            if "$exe"; then ran=$((ran+1)); else echo "FAILED: $exe"; fails=$((fails+1)); fi
            echo "::endgroup::"
          done < <(find build -path '*-tests_artefacts/Debug/*' -type f \( -name '*-tests' -o -name '*-tests.exe' \))
          echo "ran=$ran failed=$fails"
          [ "$ran" -gt 0 ] && [ "$fails" -eq 0 ]

      # Headless VST3 validation (pluginval). Phase 1: Windows only, hard gate at strictness 5.
      # The script auto-downloads pluginval and validates whatever product VST3s were built in
      # the Debug step above; CLAP/Standalone aren't covered by pluginval (separate phase).
      - name: Validate VST3 with pluginval (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh tests/scripts/run-pluginval.ps1 -Config Debug -Strictness 5
