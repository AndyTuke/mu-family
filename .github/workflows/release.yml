name: Release artifacts

# Manual cross-platform release. Builds the mu-family plugins in RELEASE on Linux and Windows,
# packages a per-platform demo zip on each runner, then a final `publish` job
# collects all platform zips and creates/updates the GitHub Release. The fixed-name zips are
# what the download site links to (releases/latest/download/<name>). Version comes from the
# committed build_number.txt at the run's commit — pin/commit it before dispatching.
#
# Windows is also built + deployed locally with the installer; this workflow is the source of
# the Linux (Beta) builds.
#
# macOS is ON HOLD (owner decision, 2026-10-02): without an Apple code-signing certificate the
# builds can't be notarized, so they aren't shipped. macos-latest is out of the matrix; the
# macOS-only steps below are kept, dormant, so re-enabling is just adding it back.

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # macos-latest on hold — see header

    env:
      JUCE_PATH: ${{ github.workspace }}/JUCE

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read JUCE pin
        id: juce
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < juce-version.txt)" >> "$GITHUB_OUTPUT"   # single pin, also checked by CMake

      - name: Checkout JUCE ${{ steps.juce.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ steps.juce.outputs.version }}
          path: JUCE

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libxcomposite-dev libxrender-dev libxi-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev ccache

      # Reuse compiled objects between runs: JUCE and mu-core are identical from one release to the next.
      - name: Cache compiler output (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('juce-version.txt') }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ hashFiles('juce-version.txt') }}-

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DMUFAMILY_DEPLOY_TESTERS=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache

      # MSVC compiles one file at a time unless told otherwise: /MP spreads each project over the cores.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        env:
          CXXFLAGS: /MP   # added to CMake's default MSVC flags (setting CMAKE_CXX_FLAGS would replace them)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DMUFAMILY_DEPLOY_TESTERS=OFF

      - name: Build Release plugins
        run: >
          cmake --build build --config Release --parallel 4 --target
          mu-clid_VST3 mu-clid_CLAP mu-clid_Standalone
          mu-clid-midi_VST3 mu-clid-midi_CLAP
          mu-tant_VST3 mu-tant_CLAP mu-tant_Standalone
          mu-on_VST3 mu-on_CLAP mu-on_Standalone
          mu-toni_VST3 mu-toni_CLAP mu-toni_Standalone

      # mu-link is a Windows desktop app (freeware); built and zipped on the Windows runner only.
      - name: Build mu-link (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel 4 --target mu-link

      # AU is macOS-only (the _AU targets only exist in an APPLE configure — family rule).
      - name: Build AU (macOS only)
        if: runner.os == 'macOS'
        run: >
          cmake --build build --config Release --target
          mu-clid_AU mu-clid-midi_AU mu-tant_AU mu-on_AU mu-toni_AU

      # ── Package per-platform demo zips (fixed names the download site links to) ──
      - name: Package demo zips (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $r = "build"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          # mu-Clid (VST3 + CLAP + Standalone)
          New-Item -ItemType Directory -Path staging\mu-Clid -Force | Out-Null
          Copy-Item "$r\mu-clid\mu-clid_artefacts\Release\VST3\mu-Clid.vst3" staging\mu-Clid\ -Recurse
          Copy-Item "$r\mu-clid\mu-clid_artefacts\Release\CLAP\mu-Clid.clap" staging\mu-Clid\
          Copy-Item "$r\mu-clid\mu-clid_artefacts\Release\Standalone\mu-Clid.exe" staging\mu-Clid\
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.txt,SOURCE.txt "staging\mu-Clid\"
          Compress-Archive -Path staging\mu-Clid\* -DestinationPath dist\mu-Clid-Windows.zip
          # mu-Clid MIDI (VST3 + CLAP)
          New-Item -ItemType Directory -Path "staging\mu-Clid MIDI" -Force | Out-Null
          Copy-Item "$r\mu-clid-midi\mu-clid-midi_artefacts\Release\VST3\mu-Clid MIDI.vst3" "staging\mu-Clid MIDI\" -Recurse
          Copy-Item "$r\mu-clid-midi\mu-clid-midi_artefacts\Release\CLAP\mu-Clid MIDI.clap" "staging\mu-Clid MIDI\"
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.txt,SOURCE.txt "staging\mu-Clid MIDI\"
          Compress-Archive -Path "staging\mu-Clid MIDI\*" -DestinationPath dist\mu-Clid-MIDI-Windows.zip
          # mu-Tant (VST3 + CLAP + Standalone)
          New-Item -ItemType Directory -Path staging\mu-Tant -Force | Out-Null
          Copy-Item "$r\mu-tant\mu-tant_artefacts\Release\VST3\mu-Tant.vst3" staging\mu-Tant\ -Recurse
          Copy-Item "$r\mu-tant\mu-tant_artefacts\Release\CLAP\mu-Tant.clap" staging\mu-Tant\
          Copy-Item "$r\mu-tant\mu-tant_artefacts\Release\Standalone\mu-Tant.exe" staging\mu-Tant\
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.txt,SOURCE.txt "staging\mu-Tant\"
          Compress-Archive -Path staging\mu-Tant\* -DestinationPath dist\mu-Tant-Windows.zip
          # mu-Toni (VST3 + CLAP + Standalone)
          New-Item -ItemType Directory -Path staging\mu-Toni -Force | Out-Null
          Copy-Item "$r\mu-toni\mu-toni_artefacts\Release\VST3\mu-Toni.vst3" staging\mu-Toni\ -Recurse
          Copy-Item "$r\mu-toni\mu-toni_artefacts\Release\CLAP\mu-Toni.clap" staging\mu-Toni\
          Copy-Item "$r\mu-toni\mu-toni_artefacts\Release\Standalone\mu-Toni.exe" staging\mu-Toni\
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.txt,SOURCE.txt "staging\mu-Toni\"
          Compress-Archive -Path staging\mu-Toni\* -DestinationPath dist\mu-Toni-Windows.zip
          # mu-On (VST3 + CLAP + Standalone)
          New-Item -ItemType Directory -Path staging\mu-On -Force | Out-Null
          Copy-Item "$r\mu-on\mu-on_artefacts\Release\VST3\mu-On.vst3" staging\mu-On\ -Recurse
          Copy-Item "$r\mu-on\mu-on_artefacts\Release\CLAP\mu-On.clap" staging\mu-On\
          Copy-Item "$r\mu-on\mu-on_artefacts\Release\Standalone\mu-On.exe" staging\mu-On\
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.txt,SOURCE.txt "staging\mu-On\"
          Compress-Archive -Path staging\mu-On\* -DestinationPath dist\mu-On-Windows.zip
          # mu-Link (desktop app)
          New-Item -ItemType Directory -Path staging\mu-Link -Force | Out-Null
          Copy-Item "$r\mu-link\mu-link_artefacts\Release\mu-link.exe" staging\mu-Link\
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.txt,SOURCE.txt "staging\mu-Link\"
          Compress-Archive -Path staging\mu-Link\* -DestinationPath dist\mu-Link-Windows.zip

      - name: Package demo zips (macOS — ditto preserves perms/signature)
        if: runner.os == 'macOS'
        run: |
          set -e
          mkdir -p dist
          pack() {  # $1 = staging subdir name, $2 = output zip
            ditto -c -k --sequesterRsrc --keepParent "staging/$1" "dist/$2"
          }
          R=build
          # mu-Clid (VST3 + CLAP + AU + Standalone.app)
          mkdir -p "staging/mu-Clid"
          cp -R "$R/mu-clid/mu-clid_artefacts/Release/VST3/mu-Clid.vst3"        "staging/mu-Clid/"
          cp -R "$R/mu-clid/mu-clid_artefacts/Release/CLAP/mu-Clid.clap"        "staging/mu-Clid/"
          cp -R "$R/mu-clid/mu-clid_artefacts/Release/AU/mu-Clid.component"     "staging/mu-Clid/" 2>/dev/null || true
          cp -R "$R/mu-clid/mu-clid_artefacts/Release/Standalone/mu-Clid.app"   "staging/mu-Clid/" 2>/dev/null || true
          cp LICENSE THIRD_PARTY_NOTICES.txt SOURCE.txt "staging/mu-Clid/"
          pack "mu-Clid" "mu-Clid-macOS.zip"
          # mu-Clid MIDI (VST3 + CLAP + AU)
          mkdir -p "staging/mu-Clid MIDI"
          cp -R "$R/mu-clid-midi/mu-clid-midi_artefacts/Release/VST3/mu-Clid MIDI.vst3"    "staging/mu-Clid MIDI/"
          cp -R "$R/mu-clid-midi/mu-clid-midi_artefacts/Release/CLAP/mu-Clid MIDI.clap"    "staging/mu-Clid MIDI/"
          cp -R "$R/mu-clid-midi/mu-clid-midi_artefacts/Release/AU/mu-Clid MIDI.component" "staging/mu-Clid MIDI/" 2>/dev/null || true
          cp LICENSE THIRD_PARTY_NOTICES.txt SOURCE.txt "staging/mu-Clid MIDI/"
          pack "mu-Clid MIDI" "mu-Clid-MIDI-macOS.zip"
          # mu-Tant (VST3 + CLAP + AU + Standalone.app)
          mkdir -p "staging/mu-Tant"
          cp -R "$R/mu-tant/mu-tant_artefacts/Release/VST3/mu-Tant.vst3"        "staging/mu-Tant/"
          cp -R "$R/mu-tant/mu-tant_artefacts/Release/CLAP/mu-Tant.clap"        "staging/mu-Tant/"
          cp -R "$R/mu-tant/mu-tant_artefacts/Release/AU/mu-Tant.component"     "staging/mu-Tant/" 2>/dev/null || true
          cp -R "$R/mu-tant/mu-tant_artefacts/Release/Standalone/mu-Tant.app"   "staging/mu-Tant/" 2>/dev/null || true
          cp LICENSE THIRD_PARTY_NOTICES.txt SOURCE.txt "staging/mu-Tant/"
          pack "mu-Tant" "mu-Tant-macOS.zip"

      - name: Package demo zips (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          mkdir -p dist
          R=build
          # mu-Clid (VST3 + CLAP + Standalone)
          mkdir -p "staging/mu-Clid"
          cp -R "$R/mu-clid/mu-clid_artefacts/Release/VST3/mu-Clid.vst3"      "staging/mu-Clid/"
          cp -R "$R/mu-clid/mu-clid_artefacts/Release/CLAP/mu-Clid.clap"      "staging/mu-Clid/"
          cp -R "$R/mu-clid/mu-clid_artefacts/Release/Standalone/mu-Clid"     "staging/mu-Clid/" 2>/dev/null || true
          cp LICENSE THIRD_PARTY_NOTICES.txt SOURCE.txt "staging/mu-Clid/"
          ( cd staging && zip -r -y "../dist/mu-Clid-Linux.zip" "mu-Clid" )
          # mu-Clid MIDI (VST3 + CLAP)
          mkdir -p "staging/mu-Clid MIDI"
          cp -R "$R/mu-clid-midi/mu-clid-midi_artefacts/Release/VST3/mu-Clid MIDI.vst3" "staging/mu-Clid MIDI/"
          cp -R "$R/mu-clid-midi/mu-clid-midi_artefacts/Release/CLAP/mu-Clid MIDI.clap" "staging/mu-Clid MIDI/"
          cp LICENSE THIRD_PARTY_NOTICES.txt SOURCE.txt "staging/mu-Clid MIDI/"
          ( cd staging && zip -r -y "../dist/mu-Clid-MIDI-Linux.zip" "mu-Clid MIDI" )
          # mu-Tant (VST3 + CLAP + Standalone)
          mkdir -p "staging/mu-Tant"
          cp -R "$R/mu-tant/mu-tant_artefacts/Release/VST3/mu-Tant.vst3"      "staging/mu-Tant/"
          cp -R "$R/mu-tant/mu-tant_artefacts/Release/CLAP/mu-Tant.clap"      "staging/mu-Tant/"
          cp -R "$R/mu-tant/mu-tant_artefacts/Release/Standalone/mu-Tant"     "staging/mu-Tant/" 2>/dev/null || true
          cp LICENSE THIRD_PARTY_NOTICES.txt SOURCE.txt "staging/mu-Tant/"
          ( cd staging && zip -r -y "../dist/mu-Tant-Linux.zip" "mu-Tant" )
          # mu-Toni (VST3 + CLAP + Standalone)
          mkdir -p "staging/mu-Toni"
          cp -R "$R/mu-toni/mu-toni_artefacts/Release/VST3/mu-Toni.vst3"      "staging/mu-Toni/"
          cp -R "$R/mu-toni/mu-toni_artefacts/Release/CLAP/mu-Toni.clap"      "staging/mu-Toni/"
          cp -R "$R/mu-toni/mu-toni_artefacts/Release/Standalone/mu-Toni"     "staging/mu-Toni/" 2>/dev/null || true
          cp LICENSE THIRD_PARTY_NOTICES.txt SOURCE.txt "staging/mu-Toni/"
          ( cd staging && zip -r -y "../dist/mu-Toni-Linux.zip" "mu-Toni" )
          # mu-On (VST3 + CLAP + Standalone)
          mkdir -p "staging/mu-On"
          cp -R "$R/mu-on/mu-on_artefacts/Release/VST3/mu-On.vst3"            "staging/mu-On/"
          cp -R "$R/mu-on/mu-on_artefacts/Release/CLAP/mu-On.clap"            "staging/mu-On/"
          cp -R "$R/mu-on/mu-on_artefacts/Release/Standalone/mu-On"           "staging/mu-On/" 2>/dev/null || true
          cp LICENSE THIRD_PARTY_NOTICES.txt SOURCE.txt "staging/mu-On/"
          ( cd staging && zip -r -y "../dist/mu-On-Linux.zip" "mu-On" )

      - name: Upload platform release zips
        uses: actions/upload-artifact@v4
        with:
          name: release-zips-${{ matrix.os }}
          if-no-files-found: error
          path: dist/*.zip

  # ── Collect every platform's zips and publish one GitHub Release ────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all platform release zips
        uses: actions/download-artifact@v4
        with:
          pattern: release-zips-*
          path: dist
          merge-multiple: true

      - name: Create / update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=$(tr -d '[:space:]' < build_number.txt)
          base=$(tr -d '[:space:]' < version.txt)   # family major.minor
          tag="v$base.0.$build"
          echo "Publishing $tag with:"; ls -1 dist
          # Create if new, otherwise upload/replace assets on the existing release.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip --clobber
          else
            gh release create "$tag" \
              --title "mu-family $tag" \
              --notes "mu-family $tag — Windows release; Linux is Beta. macOS is on hold. Please report any issues." \
              dist/*.zip
          fi
