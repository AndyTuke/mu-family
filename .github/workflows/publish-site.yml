name: Publish site

# MANUAL ONLY: a push or PR must never trigger this. The owner (or /release) dispatches it
# (`gh workflow run publish-site.yml --ref main`) to publish site/ from the chosen ref to the
# gh-pages branch, which GitHub Pages serves. It costs a few seconds of Actions time, nothing else.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Copy site/ over the gh-pages branch and push if anything changed
        run: |
          set -e
          # Replace everything except .git (and keep a CNAME file if Pages created one).
          cd pages
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name CNAME -exec rm -rf {} +
          cp -a ../src/site/. .
          touch .nojekyll
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "Publish site from ${GITHUB_SHA::8}"
            git push origin gh-pages
          fi
